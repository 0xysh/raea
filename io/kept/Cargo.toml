[package]
name = "raea-io-kept"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A long render's 3D parts kept on disk as its frames come, each props map written once by its content, read back for the checks at its end"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raea-core-scene = { path = "../../core/scene" }
# the temp file the parts go to, gone when raea is
raea-io-home = { path = "../home" }
